<!DOCTYPE html>

    <link rel="icon" href="../../assets/icons/Logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">

<body>
    <header class="header">
        <div class="container header-container">
            <a href="../landing/index.html" class="logo">
                <img src="../../assets/icons/Logo.svg" alt="Online Zoo Logo">
            </a>

            <nav class="navigation">
                <ul class="nav-list">
                    <li><a href="../landing/index.html" class="nav-link">ABOUT</a></li>
                    <li><a href="#" class="nav-link active">MAP</a></li>

            </nav>

            <div class="socials">
                <a href="https://youtube.com" target="_blank" aria-label="YouTube"><img src="../../assets/icons/YouTube.svg" alt="YouTube"></a>
                <a href="https://instagram.com" target="_blank" aria-label="Instagram"><img src="../../assets/icons/Instagram.svg" alt="Instagram"></a>

            </div>
        </div>

    <main>
        <section class="map-section">
            <div class="container">
                <h1 class="map-title">FIND WHERE ARE<br>THE ANIMALS LIVE</h1>

                <div class="map-wrapper">
                    <img class="map-image" src="../../assets/images/Map.png" alt="World map with animal locations">

                    <a class="map-pin pin-1" href="#" aria-label="Eagles location">
                        <img src="../../assets/icons/Animal Location.svg" alt="Eagles pin">
                    </a>
                    <a class="map-pin pin-2" href="#" aria-label="Panda location">
                        <img src="../../assets/icons/Animal Location-1.svg" alt="Panda pin">
                    </a>
                    <a class="map-pin pin-3" href="#" aria-label="Lemur location">
                        <img src="../../assets/icons/Animal Location-2.svg" alt="Lemur pin">
                    </a>
                    <a class="map-pin pin-4" href="#" aria-label="Gorilla location">
                        <img src="../../assets/icons/Animal Location-3.svg" alt="Gorilla pin">
                    </a>
                    <a class="map-pin pin-5" href="#" aria-label="Koala location">
                        <img src="../../assets/icons/Animal Location-4.svg" alt="Koala pin">
                    </a>
                    <a class="map-pin pin-6" href="#" aria-label="Alligator location">
                        <img src="../../assets/icons/Animal Location-5.svg" alt="Alligator pin">
                    </a>
                    <a class="map-pin pin-7" href="#" aria-label="Lion location">
                        <img src="../../assets/icons/Animal Location-6.svg" alt="Lion pin">
                    </a>
                    <a class="map-pin pin-8" href="#" aria-label="Tiger location">
                        <img src="../../assets/icons/Animal Location-7.svg" alt="Tiger pin">
                    </a>
                </div>
            </div>
        </section>

        <div class="container footer-container">
            <div class="footer-top">
                <div class="footer-brand">
                    <img src="../../assets/icons/Logo.svg" alt="Online Zoo">

                    <img src="../../assets/icons/rs_school_js logo.svg" alt="RS School">
                </div>

                <nav class="footer-nav">
                    <a href="../landing/index.html">ABOUT</a>
                    <a href="#">MAP</a>
                    <a href="../zoos/panda.html">ZOOS</a>

                    <span>© 2021 DinaK</span>
                    <span>© Yem Digital</span>
                    <span>© RSSchool</span>

                <div class="footer-socials">
                    <a href="https://youtube.com" target="_blank" aria-label="YouTube">
